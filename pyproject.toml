[project]
name = "asr-bench"
version = "0.1.0"
description = "Reproducible multilingual ASR benchmark: Whisper vs Qwen3-ASR on FLEURS en/hi/ko"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "transformers>=5.13.0",
    "openai-whisper>=20250625",
    "jiwer>=3.0",
    "gradio>=5,<6",
    "soundfile>=0.12",
    "pandas>=2.0",
]
